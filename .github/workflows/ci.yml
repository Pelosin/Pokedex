name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # NOTE: testDebugUnitTest is not wired in yet — the existing unit tests
      # do not compile against the current data-source API (pre-existing drift).
      # Wire it back in when the tests are fixed.
      - name: Build & detekt
        run: ./gradlew assembleDebug detekt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
