<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Pokedex — Android app">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1116"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ee1515"/>
      <stop offset="100%" stop-color="#b31212"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="150" cy="140" r="85"/></clipPath>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="5" fill="url(#red)"/>
  <!-- Pokéball -->
  <circle cx="150" cy="140" r="85" fill="#f0f0f0" stroke="#101014" stroke-width="6"/>
  <rect x="63" y="53" width="174" height="89" fill="url(#red)" clip-path="url(#ball)"/>
  <rect x="63" y="128" width="174" height="22" fill="#101014" clip-path="url(#ball)"/>
  <circle cx="150" cy="140" r="26" fill="#101014"/>
  <circle cx="150" cy="140" r="15" fill="#f0f0f0"/>
  <!-- Title -->
  <text x="290" y="125" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#f0f6fc">Pokedex</text>
  <text x="293" y="165" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#ee1515">Native Android · Kotlin · Jetpack Compose</text>
  <text x="293" y="198" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#8b949e">Clean Architecture · Room offline cache · Hilt · Retrofit/PokeAPI · Material 3</text>
</svg>
